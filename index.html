<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Dynamic multi-chart Binance crypto dashboard" />
  <title>Crypto Live Charts</title>
  <link rel="stylesheet" href="styles.css?v=layout-dropdown-20261101-1" />
  <link rel="stylesheet" href="layout-fixes.css?v=volume-layout-20261101-2" />
  <link rel="stylesheet" href="indicator.css?v=indicator-20261102-1" />
  <link rel="stylesheet" href="s2-v51.css?v=s2-v51-20261102-1" />
  <link rel="stylesheet" href="oscillators.css?v=oscillators-20261102-1" />
  <link rel="stylesheet" href="oscillator-fixes.css?v=osc-sync-20261102-3" />
  <link rel="stylesheet" href="oscillator-pane-controls.css?v=pane-controls-20261102-1" />
  <link rel="stylesheet" href="theme-timezone.css?v=theme-vancouver-20261102-2" />
  <link rel="stylesheet" href="responsive-fit.css?v=screen-fit-20261102-1" />
  <script src="xaut-futures.js?v=xaut-router-512-fix-20261102-1"></script>
  <script src="candle-limit-512.js?v=fixed-512-xaut-fix-20261102-2"></script>
  <script src="theme-timezone.js?v=theme-vancouver-20261102-2"></script>
  <script type="importmap">
    {
      "imports": {
        "https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/+esm": "./lightweight-wrapper.js?v=price-scale-controller-20261102-2",
        "https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/+esm?oscillator-panes=1": "./oscillator-wrapper.js?v=xaut-blackout-20261102-4"
      }
    }
  </script>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">CRYPTO MARKET DASHBOARD</p>
      <h1>Binance Live Charts</h1>
    </div>
    <div class="header-actions">
      <details class="layout-dropdown">
        <summary class="layout-trigger" title="Select chart layout" aria-label="Select chart layout">
          <span class="layout-icon icon-4"></span>
          <span class="layout-caret">▾</span>
        </summary>
        <div class="layout-menu" role="menu" aria-label="Chart layout options">
          <button class="layout-button" type="button" data-layout="1" role="menuitem">
            <span class="layout-icon icon-1"></span><span>1 chart</span>
          </button>
          <button class="layout-button" type="button" data-layout="2" role="menuitem">
            <span class="layout-icon icon-2"></span><span>2 charts</span>
          </button>
          <button class="layout-button" type="button" data-layout="3" role="menuitem">
            <span class="layout-icon icon-3"></span><span>3 charts</span>
          </button>
          <button class="layout-button active" type="button" data-layout="4" role="menuitem">
            <span class="layout-icon icon-4"></span><span>4 charts</span>
          </button>
        </div>
      </details>
      <span class="live-dot"></span>
      <span>Binance live data</span>
      <button id="resetAll" class="icon-button" type="button" title="Reset all chart views">↻</button>
    </div>
  </header>

  <main class="dashboard-grid layout-4" id="dashboardGrid" data-layout="4">
    <section class="chart-card" data-chart-index="0"></section>
    <section class="chart-card" data-chart-index="1"></section>
    <section class="chart-card" data-chart-index="2"></section>
    <section class="chart-card" data-chart-index="3"></section>
  </main>

  <footer class="app-footer">
    Live crypto market data from Binance Spot and USDⓈ-M Futures REST/WebSocket APIs. Times shown in Vancouver (America/Vancouver). Not financial advice.
  </footer>

  <script type="module" src="app-v4.js?v=indicator-20261102-1"></script>
  <script src="native-price-scale.js?v=price-pan-zoom-20261102-3"></script>
  <script type="module" src="linked-crosshair.js?v=linked-crosshair-20261102-1"></script>
  <script type="module" src="oscillators.js?v=oscillators-20261102-1"></script>
  <script type="module" src="oscillator-sync-fix.js?v=osc-sync-20261102-3"></script>
  <script type="module" src="oscillator-pane-controls.js?v=pane-controls-20261102-1"></script>
  <script type="module" src="s2-v51.js?v=s2-v51-20261102-1"></script>
  <script src="responsive-fit.js?v=screen-fit-20261102-1"></script>
</body>
</html>
