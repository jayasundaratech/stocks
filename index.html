<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Dynamic multi-chart Binance crypto dashboard" />
  <title>Crypto Live Charts</title>
  <link rel="stylesheet" href="styles.css?v=live-20261030-1" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">CRYPTO MARKET DASHBOARD</p>
      <h1>Binance Live Charts</h1>
    </div>
    <div class="header-actions">
      <span class="live-dot"></span>
      <span>Binance live data</span>
      <button id="resetAll" class="icon-button" type="button" title="Reload all charts">↻</button>
    </div>
  </header>

  <main class="dashboard-grid" id="dashboardGrid">
    <section class="chart-card" data-chart-index="0"></section>
    <section class="chart-card" data-chart-index="1"></section>
    <section class="chart-card" data-chart-index="2"></section>
    <section class="chart-card" data-chart-index="3"></section>
  </main>

  <footer class="app-footer">
    Live crypto market data from Binance Spot REST and WebSocket APIs. Not financial advice.
  </footer>

  <script type="module" src="app.js?v=live-20261030-1"></script>
</body>
</html>
