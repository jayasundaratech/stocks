<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Dynamic multi-chart Binance crypto dashboard" />
  <title>Crypto Live Charts</title>
  <link rel="stylesheet" href="styles.css?v=layout-20261101-1" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">CRYPTO MARKET DASHBOARD</p>
      <h1>Binance Live Charts</h1>
    </div>
    <div class="header-actions">
      <div class="layout-switcher" role="group" aria-label="Chart layout">
        <button class="layout-button" type="button" data-layout="1" title="1 chart" aria-label="1 chart layout"><span class="layout-icon icon-1"></span></button>
        <button class="layout-button" type="button" data-layout="2" title="2 charts" aria-label="2 chart layout"><span class="layout-icon icon-2"></span></button>
        <button class="layout-button" type="button" data-layout="3" title="3 charts" aria-label="3 chart layout"><span class="layout-icon icon-3"></span></button>
        <button class="layout-button active" type="button" data-layout="4" title="4 charts" aria-label="4 chart layout"><span class="layout-icon icon-4"></span></button>
      </div>
      <span class="live-dot"></span>
      <span>Binance live data</span>
      <button id="resetAll" class="icon-button" type="button" title="Reset all chart views">↻</button>
    </div>
  </header>

  <main class="dashboard-grid layout-4" id="dashboardGrid" data-layout="4">
    <section class="chart-card" data-chart-index="0"></section>
    <section class="chart-card" data-chart-index="1"></section>
    <section class="chart-card" data-chart-index="2"></section>
    <section class="chart-card" data-chart-index="3"></section>
  </main>

  <footer class="app-footer">
    Live crypto market data from Binance Spot REST and WebSocket APIs. Not financial advice.
  </footer>

  <script type="module" src="app-v2.js?v=layout-20261101-1"></script>
</body>
</html>
