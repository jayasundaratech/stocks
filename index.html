<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dynamic multi-chart market dashboard demo" />
  <title>Market Charts Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">MARKET DASHBOARD</p>
      <h1>Dynamic Charts</h1>
    </div>
    <div class="header-actions">
      <span class="live-dot"></span>
      <span>Live demo</span>
      <button id="resetAll" class="icon-button" type="button" title="Reset all charts">↻</button>
    </div>
  </header>

  <main class="dashboard-grid" id="dashboardGrid">
    <section class="chart-card" data-chart-index="0"></section>
    <section class="chart-card" data-chart-index="1"></section>
    <section class="chart-card" data-chart-index="2"></section>
    <section class="chart-card" data-chart-index="3"></section>
  </main>

  <footer class="app-footer">
    Demo market data is simulated in the browser for learning and UI testing. Not financial advice.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
