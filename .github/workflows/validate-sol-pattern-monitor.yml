name: Validate SOL pattern monitor
on:
  push:
    branches:
      - work-sol-pattern-monitor-20261102-2120
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check candlestick-patterns/pattern-detector.js
          node --check candlestick-patterns/sol-pattern-monitor.js
      - name: Detector tests
        run: node candlestick-patterns/pattern-detector.test.js
